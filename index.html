<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LiftLog" />
  <style>
:root{
  --bg:#f7f8fb;--panel:#ffffff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;
  --accent:#2563eb;--accent-soft:#dbeafe;--danger:#dc2626;--ok:#059669;--shadow:0 8px 30px rgba(15,23,42,.07);
  --radius:18px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0b1220;--panel:#111827;--text:#f3f4f6;--muted:#9ca3af;--line:#273244;--accent:#60a5fa;--accent-soft:#14294b;--danger:#f87171;--ok:#34d399;--shadow:0 8px 30px rgba(0,0,0,.25)}
}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif}
button,input,select,textarea{font:inherit} button{cursor:pointer}
.shell{max-width:860px;margin:0 auto;min-height:100vh;padding:0 14px 88px}.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);padding:14px 2px 10px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:20px;font-weight:800;letter-spacing:-.5px}.brand i{font-style:normal;color:var(--accent)}.unit{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 11px;border-radius:12px;font-weight:700}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}.hero{padding:20px}.hero h1{font-size:24px;margin:0 0 6px}.muted{color:var(--muted)}.grid{display:grid;gap:10px}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.btn{border:0;border-radius:14px;padding:13px 14px;font-weight:800;background:var(--accent);color:white}.btn.secondary{background:var(--panel);color:var(--text);border:1px solid var(--line)}.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}.btn.danger{background:var(--danger)}.btn.small{padding:8px 10px;border-radius:10px;font-size:13px}.nav{position:fixed;z-index:30;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--panel) 95%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:7px 8px calc(7px + env(safe-area-inset-bottom))}.navin{width:min(860px,100%);display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.nav button{border:0;background:transparent;color:var(--muted);padding:8px 4px;border-radius:12px;font-size:11px;font-weight:700}.nav button.active{color:var(--accent);background:var(--accent-soft)}.nav .ico{display:block;font-size:20px;margin-bottom:2px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px}.section-title h2{font-size:18px;margin:0}.metric{padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}.metric strong{display:block;font-size:20px;margin-top:4px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;background:var(--bg);color:var(--text);outline:none}.field textarea{min-height:82px;resize:vertical}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:7px 10px;font-size:12px;font-weight:700}.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}.exercise{border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;background:var(--panel)}.exhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.exname{font-weight:850}.tag{display:inline-block;padding:4px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:800;margin-top:5px}.setrow{display:grid;grid-template-columns:44px 1fr 1fr 1fr 46px;gap:6px;align-items:center;margin-top:8px}.setrow input,.setrow select{min-width:0;width:100%;padding:9px 7px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);text-align:center}.setbadge{font-size:12px;font-weight:800;text-align:center}.donebox{width:38px;height:38px;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--text);font-size:18px}.donebox.done{background:var(--ok);color:white;border-color:var(--ok)}.warm{opacity:.68}.timer{position:sticky;bottom:76px;z-index:25;border:1px solid color-mix(in srgb,var(--accent) 55%,var(--line));background:var(--panel);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}.timer strong{font-size:22px}.timer .over{color:var(--danger)}.listrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.listrow:last-child{border-bottom:0}.right{text-align:right}.mini{font-size:12px;color:var(--muted)}.barwrap{height:9px;background:var(--bg);border-radius:999px;overflow:hidden;margin-top:6px}.bar{height:100%;background:var(--accent);border-radius:999px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{aspect-ratio:1/1;border:1px solid var(--line);border-radius:10px;background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:12px;position:relative}.day.has:after{content:"";position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--accent)}.day.today{border-color:var(--accent);font-weight:900}.day.blank{opacity:.15}.empty{text-align:center;color:var(--muted);padding:24px 8px}.notice{padding:10px 12px;border-radius:12px;background:var(--accent-soft);color:var(--text);font-size:13px}.fab{position:fixed;right:max(18px,calc((100vw - 860px)/2 + 18px));bottom:88px;width:54px;height:54px;border-radius:50%;border:0;background:var(--accent);color:white;font-size:26px;box-shadow:var(--shadow);z-index:24}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(860px,100%);max-height:88vh;overflow:auto;background:var(--panel);border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}.sheet h3{margin:0 0 14px}.hr{height:1px;background:var(--line);margin:14px 0}.nowrap{white-space:nowrap}.mono{font-variant-numeric:tabular-nums}.svgchart{width:100%;height:180px;display:block}.linkbtn{border:0;background:none;color:var(--accent);padding:0;font-weight:800}.pillrow{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.pillrow .btn{white-space:nowrap}.sessionbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sessionbar .time{font-size:24px;font-weight:900}.warning{color:var(--danger);font-size:12px;margin-top:4px}
@media(max-width:560px){.grid3{grid-template-columns:1fr 1fr}.setrow{grid-template-columns:38px 1fr 1fr 1fr 42px}.shell{padding-left:10px;padding-right:10px}.card{padding:14px}.hero{padding:17px}.top{padding-top:10px}}

  </style>
  <title>LiftLog</title>
</head>
<body>
  <div id="app"></div>
  <script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const nowISO=()=>new Date().toISOString();
const fmtDate=d=>new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(d));
const fmtTime=s=>`${Math.floor(s/60)}:${String(Math.max(0,s%60)).padStart(2,'0')}`;
const fmtDur=ms=>{const s=Math.max(0,Math.floor(ms/1000));return `${Math.floor(s/3600)}:${String(Math.floor((s%3600)/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`};
const kgToLb=kg=>kg*2.2046226218, lbToKg=lb=>lb/2.2046226218;
const rpeOptions=()=>{let o='<option value="">RPE</option>';for(let i=0;i<=20;i++){const v=i/2;o+=`<option value="${v}">${v}</option>`}return o};
const MUSCLES=['가슴','등','대퇴사두','대퇴이두','엉덩이','이두','삼두','측면어깨','전면어깨','후면어깨','종아리','복근','전완','기타'];
const EQUIP=['바벨','덤벨','머신','케이블','맨몸','스미스머신','밴드','기타'];
const seededExercises=[
  {id:'sq',name:'하이바 백스쿼트',equipment:'바벨',primary:['대퇴사두','엉덩이'],secondary:['대퇴이두'],defaultRest:180},
  {id:'bp',name:'벤치프레스',equipment:'바벨',primary:['가슴'],secondary:['삼두','전면어깨'],defaultRest:180},
  {id:'dl',name:'데드리프트',equipment:'바벨',primary:['대퇴이두','엉덩이','등'],secondary:['전완'],defaultRest:240},
  {id:'rdl',name:'루마니안 데드리프트 (RDL)',equipment:'바벨',primary:['대퇴이두','엉덩이'],secondary:['등'],defaultRest:150},
  {id:'pull',name:'풀업',equipment:'맨몸',primary:['등'],secondary:['이두','전완'],defaultRest:150},
  {id:'curl',name:'덤벨컬',equipment:'덤벨',primary:['이두'],secondary:['전완'],defaultRest:90},
  {id:'lat',name:'사이드 레터럴 레이즈',equipment:'덤벨',primary:['측면어깨'],secondary:[],defaultRest:75}
];
const blankRoutine=i=>({id:'r'+i,name:`루틴 ${i}`,exerciseIds:[]});
const defaults={version:1,unit:'kg',exercises:seededExercises,routines:[1,2,3,4,5].map(blankRoutine),workouts:[],active:null,settings:{countSecondary:false}};
let state=load(); let view='home'; let modal=null; let timerTick=null;
function load(){try{const raw=localStorage.getItem('liftlog_state');if(!raw)return structuredClone(defaults);const s=JSON.parse(raw);return {...structuredClone(defaults),...s,settings:{...defaults.settings,...(s.settings||{})}}}catch{return structuredClone(defaults)}}
function save(){localStorage.setItem('liftlog_state',JSON.stringify(state));}
function active(){return state.active}
function exById(id){return state.exercises.find(x=>x.id===id)}
function ensureSession(){if(!state.active){state.active={id:uid(),date:nowISO(),startedAt:Date.now(),endedAt:null,notes:'',condition:'보통',pain:'',exercises:[],restTimer:null};save()}return state.active}
function workoutDuration(w){return (w.endedAt||Date.now())-w.startedAt}
function setVolume(s){return s.warmup?0:(Number(s.weightKg)||0)*(Number(s.reps)||0)}
function e1rm(s){const w=Number(s.weightKg)||0,r=Number(s.reps)||0;if(s.warmup||!w||!r)return 0;return w*(1+r/30)}
function unitWeight(kg){if(kg===''||kg==null)return '';return +(state.unit==='kg'?kg:kgToLb(kg)).toFixed(2)}
function toKg(v){const n=Number(v)||0;return state.unit==='kg'?n:lbToKg(n)}
function workingSets(exSession){return exSession.sets.filter(s=>!s.warmup && s.done)}
function sessionMetrics(ses){let vol=0,sets=0,best=0;ses.exercises.forEach(e=>e.sets.forEach(s=>{if(s.done&&!s.warmup){vol+=setVolume(s);sets++;best=Math.max(best,e1rm(s))}}));return {vol,sets,best}}
function musclesForWorkout(w){const out=new Set();w.exercises.forEach(e=>{const x=exById(e.exerciseId);if(!x)return;x.primary.forEach(m=>out.add(m));if(state.settings.countSecondary)x.secondary.forEach(m=>out.add(m))});return [...out]}
function sameWeek(d1,d2){const a=startOfWeek(new Date(d1)),b=startOfWeek(new Date(d2));return a.toDateString()===b.toDateString()}
function startOfWeek(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setHours(0,0,0,0);x.setDate(x.getDate()-day);return x}
function sameMonth(d1,d2){const a=new Date(d1),b=new Date(d2);return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()}
function escapeHtml(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function nav(){return `<div class="nav"><div class="navin">${[['home','⌂','오늘'],['history','◷','기록'],['stats','▥','통계'],['routines','≡','루틴'],['exercises','＋','운동']].map(([v,i,t])=>`<button data-view="${v}" class="${view===v?'active':''}"><span class="ico">${i}</span>${t}</button>`).join('')}</div></div>`}
function shell(content){return `<div class="shell"><div class="top"><div class="brand">Lift<i>Log</i></div><button class="unit" id="unitToggle">${state.unit.toUpperCase()}</button></div>${content}</div>${nav()}${modal?renderModal():''}`}
function render(){clearInterval(timerTick);document.getElementById('app').innerHTML=shell(({home:homeView,history:historyView,stats:statsView,routines:routinesView,exercises:exercisesView}[view])());bind();if(active()?.restTimer||active()) timerTick=setInterval(()=>{updateLiveTimes()},500)}
function homeView(){const ses=active();if(ses)return workoutView(ses);const last=state.workouts.at(-1);return `<div class="card hero"><div class="muted">오늘의 운동</div><h1>${new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric',weekday:'short'}).format(new Date())}</h1><p class="muted">기록은 이 기기에 저장됩니다. 인터넷이 없어도 사용할 수 있습니다.</p><button class="btn" id="startWorkout">운동 시작</button></div>
<div class="section-title"><h2>빠른 시작</h2></div><div class="pillrow">${state.routines.map(r=>`<button class="btn secondary" data-start-routine="${r.id}">${escapeHtml(r.name)}</button>`).join('')}</div>
${last?`<div class="section-title"><h2>최근 운동</h2></div>${workoutSummaryCard(last)}`:''}
<div class="section-title"><h2>백업</h2></div><div class="card"><p class="muted">기기를 바꾸기 전에는 백업 파일을 저장하세요.</p><div class="grid grid2"><button class="btn secondary" id="exportBtn">백업 내보내기</button><button class="btn secondary" id="importBtn">백업 불러오기</button><input id="importFile" type="file" accept="application/json" hidden></div></div>`}
function workoutView(ses){const m=sessionMetrics(ses);return `<div class="card"><div class="sessionbar"><div><div class="mini">운동 진행 중</div><div class="time mono" id="workoutClock">${fmtDur(workoutDuration(ses))}</div></div><div style="margin-left:auto" class="right"><div class="mini">본세트 ${m.sets}세트</div><strong>${Math.round(m.vol).toLocaleString()} kg</strong></div></div></div>
${ses.exercises.length?ses.exercises.map((e,idx)=>exerciseSessionCard(e,idx)).join(''):'<div class="card empty">아직 운동이 없습니다.<br>아래 버튼으로 운동을 추가하세요.</div>'}
<button class="btn secondary" id="addExerciseToSession" style="width:100%;margin:4px 0 12px">+ 운동 추가</button>
<div class="card"><div class="grid grid2"><div class="field"><label>컨디션</label><select id="condition">${['매우 좋음','좋음','보통','나쁨','매우 나쁨'].map(x=>`<option ${ses.condition===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>통증 메모</label><input id="pain" value="${escapeHtml(ses.pain)}" placeholder="예: 오른쪽 무릎 2/10"></div></div><div class="field" style="margin-top:10px"><label>오늘 메모</label><textarea id="sessionNotes" placeholder="느낀점, 자세, 다음 운동 메모 등">${escapeHtml(ses.notes)}</textarea></div></div>
<button class="btn danger" id="finishWorkout" style="width:100%">운동 종료 및 저장</button>${renderTimer(ses)}`}
function exerciseSessionCard(e,idx){const x=exById(e.exerciseId);if(!x)return '';return `<div class="exercise" data-exsession="${e.id}"><div class="exhead"><div><div class="exname">${escapeHtml(x.name)}</div><span class="tag">${escapeHtml(x.equipment)}</span> <span class="mini">${x.primary.join(' · ')}</span></div><button class="btn ghost small" data-remove-ex="${e.id}">삭제</button></div>
<div class="grid grid2" style="margin-top:10px"><div class="field"><label>기본 휴식</label><select data-rest="${e.id}">${[45,60,75,90,120,150,180,210,240,300].map(v=>`<option value="${v}" ${e.restSec===v?'selected':''}>${Math.floor(v/60)}분 ${v%60?v%60+'초':''}</option>`).join('')}</select></div><div class="field"><label>운동 메모</label><input data-exnote="${e.id}" value="${escapeHtml(e.note||'')}" placeholder="예: 2세트부터 벨트"></div></div>
<div class="setrow mini" style="margin-top:12px"><div>세트</div><div>무게(${state.unit})</div><div>횟수</div><div>RPE</div><div>완료</div></div>
${e.sets.map((s,i)=>setRow(e,s,i)).join('')}<button class="linkbtn" data-add-set="${e.id}" style="margin-top:10px">+ 세트 추가</button></div>`}
function setRow(e,s,i){return `<div class="setrow ${s.warmup?'warm':''}" data-set="${s.id}"><button class="chip ${s.warmup?'on':''}" data-warm="${e.id}|${s.id}" title="워밍업/본세트">${s.warmup?'W':i+1}</button><input inputmode="decimal" data-weight="${e.id}|${s.id}" value="${unitWeight(s.weightKg)}" placeholder="0"><input inputmode="numeric" data-reps="${e.id}|${s.id}" value="${s.reps||''}" placeholder="0"><select data-rpe="${e.id}|${s.id}">${rpeOptions().replace(`value="${s.rpe}"`,`value="${s.rpe}" selected`)}</select><button class="donebox ${s.done?'done':''}" data-done="${e.id}|${s.id}">${s.done?'✓':'□'}</button></div>${s.done&&s.restActualSec!=null?`<div class="mini" style="margin:4px 0 0 44px">휴식 ${fmtTime(s.restActualSec)}${s.restTargetSec?` · 목표 ${fmtTime(s.restTargetSec)}`:''}</div>`:''}`}
function renderTimer(ses){if(!ses.restTimer)return '';const t=ses.restTimer;const elapsed=Math.floor((Date.now()-t.startedAt)/1000);const remain=t.targetSec-elapsed;return `<div class="timer"><div><div class="mini">휴식 · ${escapeHtml(t.exerciseName)}</div><strong id="restClock" class="mono ${remain<0?'over':''}">${remain>=0?fmtTime(remain):'+'+fmtTime(-remain)}</strong></div><button class="btn small" id="nextSetStart">다음 세트 시작</button></div>`}
function workoutSummaryCard(w){const m=sessionMetrics(w);const muscles=musclesForWorkout(w);return `<div class="card"><div class="listrow"><div><strong>${fmtDate(w.date)}</strong><div class="mini">${muscles.join(' · ')||'부위 미지정'}</div></div><div class="right"><strong>${fmtDur(workoutDuration(w))}</strong><div class="mini">본세트 ${m.sets} · ${Math.round(m.vol).toLocaleString()}kg</div></div></div>${w.exercises.map(e=>{const x=exById(e.exerciseId);const sets=workingSets(e);return `<div class="listrow"><div>${escapeHtml(x?.name||'삭제된 운동')}</div><div class="right mini">${sets.length}세트 · ${Math.round(sets.reduce((a,s)=>a+setVolume(s),0)).toLocaleString()}kg</div></div>`}).join('')}</div>`}
function historyView(){const ws=[...state.workouts].reverse();const today=new Date();return `<div class="section-title"><h2>과거 기록</h2><button class="btn small secondary" id="calendarToggle">달력</button></div><div class="card">${calendar(today)}</div><div id="historyList">${ws.length?ws.map(w=>`<button class="card" data-open-workout="${w.id}" style="width:100%;text-align:left;color:inherit">${workoutSummaryCard(w).replace(/^<div class="card">|<\/div>$/g,'')}</button>`).join(''):'<div class="card empty">저장된 운동이 없습니다.</div>'}</div>`}
function calendar(base){const y=base.getFullYear(),m=base.getMonth();const first=new Date(y,m,1);const start=(first.getDay()+6)%7;const days=new Date(y,m+1,0).getDate();let cells='';for(let i=0;i<start;i++)cells+='<div class="day blank"></div>';for(let d=1;d<=days;d++){const dt=new Date(y,m,d);const has=state.workouts.some(w=>new Date(w.date).toDateString()===dt.toDateString());const today=dt.toDateString()===new Date().toDateString();cells+=`<button class="day ${has?'has':''} ${today?'today':''}" data-day="${dt.toISOString()}">${d}</button>`}return `<div class="listrow"><strong>${y}년 ${m+1}월</strong><span class="mini">점 = 운동 기록</span></div><div class="calendar"><div class="mini">월</div><div class="mini">화</div><div class="mini">수</div><div class="mini">목</div><div class="mini">금</div><div class="mini">토</div><div class="mini">일</div>${cells}</div>`}
function statsView(){const now=new Date(),week=state.workouts.filter(w=>sameWeek(w.date,now)),month=state.workouts.filter(w=>sameMonth(w.date,now));const wm=countSets(week),mm=countSets(month);return `<div class="section-title"><h2>통계</h2></div><div class="grid grid2"><div class="metric"><span class="mini">이번 주 본세트</span><strong>${Object.values(wm.muscle).reduce((a,b)=>a+b,0)}</strong></div><div class="metric"><span class="mini">이번 달 본세트</span><strong>${Object.values(mm.muscle).reduce((a,b)=>a+b,0)}</strong></div></div>
<div class="section-title"><h2>주간 부위별 세트</h2></div>${barCard(wm.muscle)}<div class="section-title"><h2>월간 부위별 세트</h2></div>${barCard(mm.muscle)}<div class="section-title"><h2>주간 운동별 세트</h2></div>${barCard(wm.exercise)}<div class="section-title"><h2>월간 운동별 세트</h2></div>${barCard(mm.exercise)}
<div class="section-title"><h2>운동별 중량 / 예상 1RM</h2></div><div class="card"><div class="field"><label>운동 선택</label><select id="chartExercise"><option value="">선택</option>${state.exercises.map(x=>`<option value="${x.id}">${escapeHtml(x.name)}</option>`).join('')}</select></div><div id="exerciseChart" class="empty">운동을 선택하면 그래프가 표시됩니다.</div></div>`}
function countSets(workouts){const muscle={},exercise={};workouts.forEach(w=>w.exercises.forEach(es=>{const x=exById(es.exerciseId);if(!x)return;const c=workingSets(es).length;exercise[x.name]=(exercise[x.name]||0)+c;x.primary.forEach(m=>muscle[m]=(muscle[m]||0)+c);if(state.settings.countSecondary)x.secondary.forEach(m=>muscle[m]=(muscle[m]||0)+c)}));return {muscle,exercise}}
function barCard(obj){const arr=Object.entries(obj).sort((a,b)=>b[1]-a[1]);if(!arr.length)return '<div class="card empty">아직 데이터가 없습니다.</div>';const max=Math.max(...arr.map(x=>x[1]),1);return `<div class="card">${arr.map(([k,v])=>`<div class="listrow"><div style="flex:1"><strong>${escapeHtml(k)}</strong><div class="barwrap"><div class="bar" style="width:${v/max*100}%"></div></div></div><div class="right"><strong>${v}</strong><div class="mini">세트</div></div></div>`).join('')}</div>`}
function routinesView(){return `<div class="section-title"><h2>루틴</h2></div><div class="notice">5개의 루틴 슬롯은 언제든 이름과 운동 구성을 바꿀 수 있습니다.</div>${state.routines.map(r=>`<div class="card"><div class="listrow"><div><strong>${escapeHtml(r.name)}</strong><div class="mini">${r.exerciseIds.map(id=>exById(id)?.name).filter(Boolean).join(' · ')||'운동 없음'}</div></div><button class="btn small secondary" data-edit-routine="${r.id}">편집</button></div><button class="btn" data-start-routine="${r.id}" style="width:100%;margin-top:10px" ${!r.exerciseIds.length?'disabled':''}>이 루틴으로 시작</button></div>`).join('')}`}
function exercisesView(){return `<div class="section-title"><h2>운동 종목</h2></div>${state.exercises.map(x=>`<div class="card"><div class="listrow"><div><strong>${escapeHtml(x.name)}</strong><div class="mini">${escapeHtml(x.equipment)} · 주동근 ${x.primary.join(', ')}</div></div><button class="btn small secondary" data-edit-ex="${x.id}">편집</button></div></div>`).join('')}<button class="fab" id="newExercise">+</button>`}
function renderModal(){if(!modal)return '';if(modal.type==='pickExercise')return `<div class="modal" data-close-modal><div class="sheet" onclick="event.stopPropagation()"><h3>운동 추가</h3><div class="field"><input id="exerciseSearch" placeholder="운동 검색"></div><div id="exercisePickList">${state.exercises.map(x=>`<button class="listrow" data-pick-ex="${x.id}" style="width:100%;background:none;border:0;color:inherit;text-align:left"><div><strong>${escapeHtml(x.name)}</strong><div class="mini">${x.equipment} · ${x.primary.join(' · ')}</div></div><span>＋</span></button>`).join('')}</div></div></div>`;
if(modal.type==='exerciseForm'){const x=modal.id?exById(modal.id):{name:'',equipment:'바벨',primary:[],secondary:[],defaultRest:120};return `<div class="modal" data-close-modal><div class="sheet" onclick="event.stopPropagation()"><h3>${modal.id?'운동 편집':'새 운동 추가'}</h3><div class="field"><label>운동 이름</label><input id="exName" value="${escapeHtml(x.name)}"></div><div class="field" style="margin-top:10px"><label>기구</label><select id="exEquip">${EQUIP.map(e=>`<option ${x.equipment===e?'selected':''}>${e}</option>`).join('')}</select></div><div class="field" style="margin-top:10px"><label>주동근 (복수 선택 가능)</label><div class="chips" id="primaryMuscles">${MUSCLES.map(m=>`<button class="chip ${x.primary.includes(m)?'on':''}" data-muscle="primary|${m}">${m}</button>`).join('')}</div></div><div class="field" style="margin-top:10px"><label>보조근</label><div class="chips" id="secondaryMuscles">${MUSCLES.map(m=>`<button class="chip ${x.secondary.includes(m)?'on':''}" data-muscle="secondary|${m}">${m}</button>`).join('')}</div></div><div class="field" style="margin-top:10px"><label>기본 휴식시간</label><select id="exRest">${[45,60,75,90,120,150,180,210,240,300].map(v=>`<option value="${v}" ${x.defaultRest===v?'selected':''}>${fmtTime(v)}</option>`).join('')}</select></div><button class="btn" id="saveExercise" style="width:100%;margin-top:14px">저장</button></div></div>`;}
if(modal.type==='routine'){const r=state.routines.find(x=>x.id===modal.id);return `<div class="modal" data-close-modal><div class="sheet" onclick="event.stopPropagation()"><h3>루틴 편집</h3><div class="field"><label>루틴 이름</label><input id="routineName" value="${escapeHtml(r.name)}"></div><div class="hr"></div>${state.exercises.map(x=>`<label class="listrow"><div><strong>${escapeHtml(x.name)}</strong><div class="mini">${x.equipment}</div></div><input type="checkbox" data-routine-ex="${x.id}" ${r.exerciseIds.includes(x.id)?'checked':''}></label>`).join('')}<button class="btn" id="saveRoutine" style="width:100%;margin-top:14px">저장</button></div></div>`;}
if(modal.type==='workoutDetail'){const w=state.workouts.find(x=>x.id===modal.id);if(!w)return '';const m=sessionMetrics(w);return `<div class="modal" data-close-modal><div class="sheet" onclick="event.stopPropagation()"><h3>${fmtDate(w.date)} 운동</h3><div class="grid grid3"><div class="metric"><span class="mini">운동시간</span><strong>${fmtDur(workoutDuration(w))}</strong></div><div class="metric"><span class="mini">본세트</span><strong>${m.sets}</strong></div><div class="metric"><span class="mini">볼륨</span><strong>${Math.round(m.vol).toLocaleString()}</strong></div></div>${w.exercises.map(es=>{const x=exById(es.exerciseId);return `<div class="exercise"><strong>${escapeHtml(x?.name||'삭제된 운동')}</strong><div class="mini">${escapeHtml(es.note||'')}</div>${es.sets.map((s,i)=>`<div class="listrow ${s.warmup?'warm':''}"><div>${s.warmup?'W':i+1} · ${unitWeight(s.weightKg)}${state.unit} × ${s.reps||0}${s.rpe!==''?` · RPE ${s.rpe}`:''}</div><div class="right mini">${s.done?'완료':'미완료'}${s.restActualSec!=null?`<br>휴식 ${fmtTime(s.restActualSec)}`:''}</div></div>`).join('')}</div>`}).join('')}<div class="card"><strong>컨디션</strong><p class="muted">${escapeHtml(w.condition||'-')}</p><strong>통증</strong><p class="muted">${escapeHtml(w.pain||'-')}</p><strong>메모</strong><p class="muted">${escapeHtml(w.notes||'-')}</p></div><button class="btn danger" data-delete-workout="${w.id}" style="width:100%">이 기록 삭제</button></div></div>`}return ''}
function bind(){
  $('#unitToggle')?.addEventListener('click',()=>{state.unit=state.unit==='kg'?'lb':'kg';save();render()});
  $$('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;modal=null;render()});
  $('#startWorkout')?.addEventListener('click',()=>{ensureSession();render()});
  $$('[data-start-routine]').forEach(b=>b.onclick=()=>startRoutine(b.dataset.startRoutine));
  $('#addExerciseToSession')?.addEventListener('click',()=>{modal={type:'pickExercise'};render()});
  $$('[data-remove-ex]').forEach(b=>b.onclick=()=>{state.active.exercises=state.active.exercises.filter(x=>x.id!==b.dataset.removeEx);save();render()});
  $$('[data-add-set]').forEach(b=>b.onclick=()=>{const e=state.active.exercises.find(x=>x.id===b.dataset.addSet);e.sets.push(newSet(false));save();render()});
  $$('[data-rest]').forEach(s=>s.onchange=()=>{state.active.exercises.find(x=>x.id===s.dataset.rest).restSec=Number(s.value);save()});
  $$('[data-exnote]').forEach(i=>i.onchange=()=>{state.active.exercises.find(x=>x.id===i.dataset.exnote).note=i.value;save()});
  $$('[data-weight]').forEach(i=>i.onchange=()=>changeSet(i.dataset.weight,'weightKg',toKg(i.value)));
  $$('[data-reps]').forEach(i=>i.onchange=()=>changeSet(i.dataset.reps,'reps',Number(i.value)||0));
  $$('[data-rpe]').forEach(i=>i.onchange=()=>changeSet(i.dataset.rpe,'rpe',i.value===''?'':Number(i.value)));
  $$('[data-warm]').forEach(b=>b.onclick=()=>{const [eid,sid]=b.dataset.warm.split('|');const s=findSet(eid,sid);s.warmup=!s.warmup;save();render()});
  $$('[data-done]').forEach(b=>b.onclick=()=>toggleDone(b.dataset.done));
  $('#nextSetStart')?.addEventListener('click',stopRest);
  $('#condition')?.addEventListener('change',e=>{state.active.condition=e.target.value;save()});
  $('#pain')?.addEventListener('change',e=>{state.active.pain=e.target.value;save()});
  $('#sessionNotes')?.addEventListener('change',e=>{state.active.notes=e.target.value;save()});
  $('#finishWorkout')?.addEventListener('click',finishWorkout);
  $('#newExercise')?.addEventListener('click',()=>{modal={type:'exerciseForm'};render()});
  $$('[data-edit-ex]').forEach(b=>b.onclick=()=>{modal={type:'exerciseForm',id:b.dataset.editEx};render()});
  $$('[data-edit-routine]').forEach(b=>b.onclick=()=>{modal={type:'routine',id:b.dataset.editRoutine};render()});
  $$('[data-open-workout]').forEach(b=>b.onclick=()=>{modal={type:'workoutDetail',id:b.dataset.openWorkout};render()});
  $$('[data-day]').forEach(b=>b.onclick=()=>{const w=state.workouts.find(w=>new Date(w.date).toDateString()===new Date(b.dataset.day).toDateString());if(w){modal={type:'workoutDetail',id:w.id};render()}});
  $$('[data-close-modal]').forEach(m=>m.onclick=()=>{modal=null;render()});
  $$('[data-pick-ex]').forEach(b=>b.onclick=()=>{addExerciseToSession(b.dataset.pickEx);modal=null;render()});
  $('#exerciseSearch')?.addEventListener('input',e=>{const q=e.target.value.toLowerCase();$$('[data-pick-ex]').forEach(b=>b.style.display=b.innerText.toLowerCase().includes(q)?'flex':'none')});
  $$('[data-muscle]').forEach(b=>b.onclick=()=>b.classList.toggle('on'));
  $('#saveExercise')?.addEventListener('click',saveExerciseForm);
  $('#saveRoutine')?.addEventListener('click',saveRoutineForm);
  $$('[data-delete-workout]').forEach(b=>b.onclick=()=>{if(confirm('이 운동 기록을 삭제할까요?')){state.workouts=state.workouts.filter(w=>w.id!==b.dataset.deleteWorkout);save();modal=null;render()}});
  $('#chartExercise')?.addEventListener('change',e=>renderExerciseChart(e.target.value));
  $('#exportBtn')?.addEventListener('click',exportData); $('#importBtn')?.addEventListener('click',()=>$('#importFile').click()); $('#importFile')?.addEventListener('change',importData);
}
function newSet(warmup=false){return {id:uid(),weightKg:'',reps:'',rpe:'',warmup,done:false,restTargetSec:null,restActualSec:null,completedAt:null}}
function addExerciseToSession(exId){const x=exById(exId);if(!x)return;ensureSession().exercises.push({id:uid(),exerciseId:exId,note:'',restSec:x.defaultRest||120,sets:[newSet(false)]});save()}
function startRoutine(rid){ensureSession();const r=state.routines.find(x=>x.id===rid);if(r&&state.active.exercises.length===0)r.exerciseIds.forEach(addExerciseToSession);view='home';render()}
function findSet(eid,sid){return state.active.exercises.find(x=>x.id===eid)?.sets.find(x=>x.id===sid)}
function changeSet(key,field,val){const [eid,sid]=key.split('|');const s=findSet(eid,sid);if(s){s[field]=val;save()}}
function toggleDone(key){const [eid,sid]=key.split('|');const e=state.active.exercises.find(x=>x.id===eid),s=findSet(eid,sid);if(!s)return;if(s.done){s.done=false;s.completedAt=null;s.restActualSec=null;if(state.active.restTimer?.setId===sid)state.active.restTimer=null;save();render();return}s.done=true;s.completedAt=Date.now();s.restTargetSec=e.restSec;s.restActualSec=null;const x=exById(e.exerciseId);state.active.restTimer={setId:sid,exerciseSessionId:eid,exerciseName:x?.name||'',startedAt:Date.now(),targetSec:e.restSec};save();render()}
function stopRest(){const t=state.active?.restTimer;if(!t)return;const s=findSet(t.exerciseSessionId,t.setId);if(s)s.restActualSec=Math.max(0,Math.floor((Date.now()-t.startedAt)/1000));state.active.restTimer=null;save();render()}
function updateLiveTimes(){const ses=active();if(!ses)return;const wc=$('#workoutClock');if(wc)wc.textContent=fmtDur(workoutDuration(ses));const rc=$('#restClock');if(rc&&ses.restTimer){const elapsed=Math.floor((Date.now()-ses.restTimer.startedAt)/1000),remain=ses.restTimer.targetSec-elapsed;rc.textContent=remain>=0?fmtTime(remain):'+'+fmtTime(-remain);rc.classList.toggle('over',remain<0)}}
function finishWorkout(){if(!state.active)return;if(state.active.restTimer)stopRest();if(!confirm('오늘 운동을 종료하고 저장할까요?'))return;state.active.endedAt=Date.now();state.workouts.push(state.active);state.active=null;save();render()}
function saveExerciseForm(){const name=$('#exName').value.trim();if(!name){alert('운동 이름을 입력하세요.');return}const primary=$$('#primaryMuscles .chip.on').map(b=>b.dataset.muscle.split('|')[1]);const secondary=$$('#secondaryMuscles .chip.on').map(b=>b.dataset.muscle.split('|')[1]).filter(m=>!primary.includes(m));if(!primary.length){alert('주동근을 1개 이상 선택하세요.');return}if(modal.id){const x=exById(modal.id);Object.assign(x,{name,equipment:$('#exEquip').value,primary,secondary,defaultRest:Number($('#exRest').value)})}else state.exercises.push({id:uid(),name,equipment:$('#exEquip').value,primary,secondary,defaultRest:Number($('#exRest').value)});save();modal=null;render()}
function saveRoutineForm(){const r=state.routines.find(x=>x.id===modal.id);r.name=$('#routineName').value.trim()||r.name;r.exerciseIds=$$('[data-routine-ex]:checked').map(x=>x.dataset.routineEx);save();modal=null;render()}
function renderExerciseChart(exId){const box=$('#exerciseChart');if(!box)return;if(!exId){box.className='empty';box.textContent='운동을 선택하면 그래프가 표시됩니다.';return}const pts=[];state.workouts.forEach(w=>{const sessions=w.exercises.filter(e=>e.exerciseId===exId);if(!sessions.length)return;let top=0,one=0;sessions.forEach(es=>workingSets(es).forEach(s=>{top=Math.max(top,Number(s.weightKg)||0);one=Math.max(one,e1rm(s))}));if(top)pts.push({date:new Date(w.date),top,one})});if(!pts.length){box.className='empty';box.textContent='아직 본세트 기록이 없습니다.';return}const W=700,H=170,pad=24,max=Math.max(...pts.flatMap(p=>[p.top,p.one])),min=Math.min(...pts.flatMap(p=>[p.top,p.one]))*.92;const x=i=>pad+(W-pad*2)*(pts.length===1?.5:i/(pts.length-1));const y=v=>H-pad-(H-pad*2)*((v-min)/(max-min||1));const path=k=>pts.map((p,i)=>(i?'L':'M')+x(i)+','+y(p[k])).join(' ');box.className='';box.innerHTML=`<div class="mini" style="margin:12px 0">실선: 최고중량 · 점선: 예상 1RM</div><svg viewBox="0 0 ${W} ${H}" class="svgchart"><path d="${path('top')}" fill="none" stroke="currentColor" stroke-width="3"/><path d="${path('one')}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="7 6"/>${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.top)}" r="4" fill="currentColor"/><circle cx="${x(i)}" cy="${y(p.one)}" r="4" fill="var(--accent)"/>`).join('')}</svg><div class="mini">최근 ${pts.length}회 기록 · 현재 최고 ${unitWeight(pts.at(-1).top)}${state.unit} · 예상 1RM ${unitWeight(pts.at(-1).one).toFixed?unitWeight(pts.at(-1).one).toFixed(1):unitWeight(pts.at(-1).one)}${state.unit}</div>`}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`liftlog-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)}
function importData(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const incoming=JSON.parse(r.result);if(!incoming.exercises||!incoming.workouts)throw new Error();if(confirm('현재 데이터를 백업 파일 내용으로 바꿀까요?')){state=incoming;save();render()}}catch{alert('올바른 LiftLog 백업 파일이 아닙니다.')}};r.readAsText(f)}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();

  </script>
