/* ===== v0.4.3 iOS modal / keyboard / search layout fix ===== */
:root{
  --modal-safe-top: env(safe-area-inset-top, 0px);
  --modal-bar-h: 64px;
}
/* Standalone iPhone fallback when safe-area env is reported too small. */
@media (display-mode: standalone) and (max-width:600px){
  :root{
    --modal-safe-top:max(env(safe-area-inset-top, 0px), 50px);
  }
}

/*
  Important layout rule:
  the WHOLE modal begins below the iPhone status area.
  The sticky header itself therefore stays at top:0 inside the usable modal.
  This avoids the previous "double safe-area" offset that could hide the search field.
*/
.modal{
  top:calc(var(--vv-top, 0px) + var(--modal-safe-top)) !important;
  height:calc(var(--vv-height, 100dvh) - var(--modal-safe-top)) !important;
  min-height:0;
}
.modal .sheet{
  max-height:100% !important;
  padding-top:16px !important;
  scroll-padding-top:16px;
}
.modal .sheet.sheet-with-bar{
  padding-top:0 !important;
  scroll-padding-top:calc(var(--modal-bar-h) + 74px);
}
.modal .sheetbar{
  top:0 !important;
  z-index:90;
  min-height:var(--modal-bar-h);
  margin-bottom:10px;
  padding:10px 16px;
  flex:0 0 auto;
}
.modal .sheetbar-actions{
  position:relative;
  z-index:3;
  flex:0 0 auto;
}
.modal .sheetbar .btn{
  min-height:44px;
  min-width:58px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  touch-action:manipulation;
  pointer-events:auto;
}
.modal .sheetbar h3{
  min-width:0;
  line-height:1.2;
}

/* Search dock: if iOS pans the sheet on keyboard focus, search can never disappear behind the header. */
.modal .sheet-with-bar .modal-search-field{
  position:sticky;
  top:var(--modal-bar-h);
  z-index:80;
  margin:0 -4px 8px;
  padding:6px 4px 8px;
  background:linear-gradient(
    180deg,
    color-mix(in srgb,var(--panel) 98%,transparent),
    color-mix(in srgb,var(--panel) 94%,var(--accent-soft))
  );
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid color-mix(in srgb,var(--accent) 11%,transparent);
}
.modal .sheet-with-bar .modal-search-field input{
  width:100%;
  min-height:46px;
  font-size:16px !important;
  scroll-margin-top:calc(var(--modal-bar-h) + 14px) !important;
}

/* Routine-name and other controls must also remain below the sticky action header. */
.modal .sheet-with-bar input:not(#routineSearch):not(#exerciseSearch),
.modal .sheet-with-bar textarea,
.modal .sheet-with-bar select,
.modal .sheet-with-bar button{
  scroll-margin-top:calc(var(--modal-bar-h) + 16px) !important;
}

/* Plain modal contents start below the status area because the modal itself has already been shifted. */
.modal .sheet.finish-sheet{
  padding-top:22px !important;
}
.modal .sheet > h3:first-child,
.modal .sheet > .section-title:first-child{
  position:relative;
  z-index:2;
}

/* Extra keyboard breathing room. */
.modal .sheet{
  padding-bottom:max(calc(22px + env(safe-area-inset-bottom)), 28px) !important;
}

function musclesForWorkout(w){const out=new Set();w.exercises.forEach(es=>{const x=exById(es.exerciseId);if(!x)return;x.primary.forEach(m=>out.add(m));if(state.settings.countSecondary)x.secondary.forEach(m=>out.add(m))});return [...out]}
function startOfWeek(d){const x=new Date(d),day=(x.getDay()+6)%7;x.setHours(0,0,0,0);x.setDate(x.getDate()-day);return x}
function sameWeek(d1,d2){return startOfWeek(new Date(d1)).toDateString()===startOfWeek(new Date(d2)).toDateString()}
function sameMonth(d1,d2){const a=new Date(d1),b=new Date(d2);return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()}
function previousExercise(exId){for(let i=state.workouts.length-1;i>=0;i--){const es=state.workouts[i].exercises.find(e=>e.exerciseId===exId);if(es)return {workout:state.workouts[i],es}}return null}
function previousBest(exId){const x=exById(exId);let weight=0,one=0;state.workouts.forEach(w=>w.exercises.filter(e=>e.exerciseId===exId).forEach(es=>es.sets.forEach(s=>{if(s.done&&!s.warmup){weight=Math.max(weight,effectiveLoadKg(x,s));one=Math.max(one,e1rm(x,s))}})));return {weight,one}}
function searchBlob(x){return [x.name,x.equipment,x.brand,...(x.aliases||[]),...(x.primary||[]),...(x.secondary||[]),...(isMachine(x)?[...MACHINE_BRANDS,...MACHINE_BRAND_ALIASES]:[])].join(' ').toLowerCase()}
function nav(){return `<div class="nav"><div class="navin">${[['home','⌂','오늘'],['history','◷','기록'],['stats','▥','통계'],['routines','≡','루틴'],['exercises','＋','운동']].map(([v,i,t])=>`<button data-view="${v}" class="${view===v?'active':''}"><span class="ico">${i}</span>${t}</button>`).join('')}</div></div>`}
function shell(content){return `<div class="shell"><div class="top"><div class="brand"><span class="brandmark"></span><span>Lift<i>Log</i></span></div><div class="topactions"><button class="iconbtn" id="settingsBtn" aria-label="설정">⚙</button></div></div>${content}</div>${nav()}${modal?renderModal():''}`} 

let modalPageScrollY=0;

function syncVisualViewport(){
  const vv=window.visualViewport;
  const h=Math.max(240,Math.round(vv?.height||window.innerHeight||document.documentElement.clientHeight));
  const top=Math.max(0,Math.round(vv?.offsetTop||0));
  document.documentElement.style.setProperty('--vv-height',`${h}px`);
  document.documentElement.style.setProperty('--vv-top',`${top}px`);
}
function lockPageForModal(){
  if(document.body.classList.contains('modal-open'))return;
  modalPageScrollY=window.scrollY||window.pageYOffset||0;
  document.body.classList.add('modal-open');
  document.body.style.position='fixed';
  document.body.style.top=`-${modalPageScrollY}px`;
  document.body.style.left='0';
  document.body.style.right='0';
  document.body.style.width='100%';
}
function unlockPageFromModal(){
  if(!document.body.classList.contains('modal-open'))return;
  document.body.classList.remove('modal-open');
  document.body.style.position='';
  document.body.style.top='';
  document.body.style.left='';
  document.body.style.right='';
  document.body.style.width='';
  window.scrollTo(0,modalPageScrollY||0);
}
function syncModalPageLock(){
  if(modal)lockPageForModal();
  else unlockPageFromModal();
}
function keepModalControlVisible(el){
  if(!el || !el.closest)return;
  const sheet=el.closest('.sheet');
  if(!sheet)return;

  const vv=window.visualViewport;
  const viewportBottom=(vv ? vv.offsetTop+vv.height : window.innerHeight)-12;
  const bar=sheet.querySelector('.sheetbar');
  const topLimit=(bar ? bar.getBoundingClientRect().bottom : sheet.getBoundingClientRect().top)+10;
  const r=el.getBoundingClientRect();

  if(r.top < topLimit){
    sheet.scrollTop += (r.top-topLimit-8);
  }else if(r.bottom > viewportBottom){
    sheet.scrollTop += (r.bottom-viewportBottom+10);
  }
}
function resetModalScrollPosition(){
  const sheet=document.querySelector('.modal .sheet');
  if(!sheet)return;
  requestAnimationFrame(()=>{
    sheet.scrollTop=0;
    requestAnimationFrame(()=>{ sheet.scrollTop=0; });
  });
}
function bindInputViewportGuards(){
  const controls=$$('input,textarea,select');
  controls.forEach(el=>{
    el.addEventListener('focus',()=>{
      syncVisualViewport();
      if(!el.closest('.sheet'))return;
      setTimeout(()=>{syncVisualViewport();keepModalControlVisible(el)},60);
      setTimeout(()=>{syncVisualViewport();keepModalControlVisible(el)},220);
    },{passive:true});
  });
}
function handleViewportMotion(){
  syncVisualViewport();
  const el=document.activeElement;
  if(el && el.closest && el.closest('.sheet')){
    setTimeout(()=>keepModalControlVisible(el),0);
  }
}
syncVisualViewport();
window.addEventListener('resize',handleViewportMotion,{passive:true});
window.addEventListener('orientationchange',()=>setTimeout(handleViewportMotion,60),{passive:true});
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',handleViewportMotion,{passive:true});
  window.visualViewport.addEventListener('scroll',handleViewportMotion,{passive:true});
}

function render(){clearInterval(timerTick);document.getElementById('app').innerHTML=shell(({home:homeView,history:historyView,stats:statsView,routines:routinesView,exercises:exercisesView}[view])());syncVisualViewport();syncModalPageLock();bind();bindInputViewportGuards();if(modal)resetModalScrollPosition();if(active()?.restTimer||active())timerTick=setInterval(updateLiveTimes,400)}
function homeView(){const ses=active();if(ses)return workoutView(ses);const last=state.workouts.at(-1),saved=state.routines.filter(r=>r.exerciseIds?.length);return `<div class="card hero"><div class="eyebrow">TRAIN · TRACK · PROGRESS</div><h1>${new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric',weekday:'short'}).format(new Date())}</h1><p class="muted">세트·RPE·실제 휴식시간을 빠르게 기록하세요.</p><button class="btn" id="startWorkout">운동 시작</button></div><div class="section-title"><h2>저장된 루틴</h2></div>${saved.length?`<div class="routine-home-grid">${saved.map(r=>`<button class="routine-home" data-start-routine="${r.id}">${escapeHtml(r.name)}<span>${r.exerciseIds.length}개 운동</span></button>`).join('')}</div>`:`<div class="card empty">저장된 루틴이 없습니다.<br>루틴 탭에서 새 루틴을 만들어보세요.</div>`}${last?`<div class="section-title"><h2>최근 운동</h2></div>${workoutSummaryCard(last)}`:''}`}
function workoutView(ses){const m=sessionMetrics(ses);return `<div class="card"><div class="sessionbar"><div><div class="mini">운동 진행 중</div><div class="time mono" id="workoutClock">${fmtDur(workoutDuration(ses))}</div></div><div style="margin-left:auto" class="right"><div class="mini">본세트 ${m.sets}세트</div><strong class="volaccent">${fmtVolume(m.vol)}</strong></div></div></div>${ses.exercises.length?`<div class="reorder-hint">운동명을 길게 눌러 위·아래로 이동하면 순서를 바꿀 수 있습니다.</div><div id="activeExerciseList">${ses.exercises.map(exerciseSessionCard).join('')}</div>`:'<div class="card empty">아직 운동이 없습니다.<br>아래 버튼으로 운동을 추가하세요.</div>'}<button class="btn secondary" id="addExerciseToSession" style="width:100%;margin:4px 0 12px">+ 운동 추가</button><div class="card"><div class="grid grid2"><div class="field"><label>컨디션</label><select id="condition">${['매우 좋음','좋음','보통','나쁨','매우 나쁨'].map(x=>`<option ${ses.condition===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>통증 메모</label><input id="pain" value="${escapeHtml(ses.pain)}" placeholder="예: 오른쪽 무릎 2/10"></div></div><div class="field" style="margin-top:10px"><label>오늘 메모</label><textarea id="sessionNotes" placeholder="느낀점, 자세, 다음 운동 메모 등">${escapeHtml(ses.notes)}</textarea></div></div><button class="btn danger" id="finishWorkout" style="width:100%">운동 종료</button>${renderTimer(ses)}`}
function previousLine(exId,unit='kg'){const p=previousExercise(exId);if(!p)return '';const sets=p.es.sets.filter(s=>s.done&&!s.warmup).slice(0,5);if(!sets.length)return '';const txt=sets.map(s=>`${unitWeight(s.weightKg,unit)}${unit}×${s.reps}${s.rpe!==''?` @${s.rpe}`:''}`).join(' · ');return `<div class="lastperf"><strong>직전 ${fmtDate(p.workout.date)}</strong> · ${txt}</div>`}
function exerciseSessionCard(e){const x=exById(e.exerciseId);if(!x)return '';const currentManufacturer=e.manufacturer||x.brand||'';const brand=(!isMachine(x)&&x.brand)?` <span class="tag brandtag">${escapeHtml(x.brand)}</span>`:'';const manufacturerControl=isMachine(x)?`<div class="session-brand-row"><select class="inline-brand" data-session-brand="${e.id}">${machineBrandOptions(currentManufacturer)}</select></div>`:'';if(x.tracking==='cardio')return `<div class="exercise" data-exsession="${e.id}"><div class="exhead"><div><div class="exname workout-drag-zone" data-workout-drag="${e.id}" title="길게 눌러 순서 변경"><span class="drag-grip">⋮⋮</span><span>${escapeHtml(x.name)}</span></div><span class="tag">유산소</span>${brand}${manufacturerControl}</div><button class="btn ghost small" data-remove-ex="${e.id}">삭제</button></div><div class="field" style="margin-top:10px"><label>운동 메모</label><input data-exnote="${e.id}" value="${escapeHtml(e.note||'')}" placeholder="메모"></div><div class="sethead" style="grid-template-columns:1fr 1fr 84px 48px"><div>시간(분)</div><div>거리(km)</div><div>RPE</div><div>완료</div></div>${e.sets.map((s,i)=>cardioSetRow(e,s,i)).join('')}<button class="linkbtn" data-add-set="${e.id}" style="margin-top:10px">+ 구간 추가</button></div>`;
return `<div class="exercise" data-exsession="${e.id}"><div class="exhead"><div><div class="exname workout-drag-zone" data-workout-drag="${e.id}" title="길게 눌러 순서 변경"><span class="drag-grip">⋮⋮</span><span>${escapeHtml(x.name)}</span></div><span class="tag">${escapeHtml(x.equipment)}</span>${brand} <span class="mini">${x.primary.join(' · ')}</span>${manufacturerControl}</div><div class="exhead-actions"><button class="exunit" data-ex-unit="${e.id}" title="이 운동의 중량 단위 전환">${(e.unit||x.preferredUnit||'kg').toUpperCase()}</button><button class="btn ghost small" data-remove-ex="${e.id}">삭제</button></div></div>${previousLine(e.exerciseId,e.unit||x.preferredUnit||'kg')}<div class="grid grid3" style="margin-top:10px"><div class="field"><label>워밍업 기본 휴식</label><select data-warm-rest="${e.id}">${restOptions(e.warmRestSec)}</select></div><div class="field"><label>본세트 기본 휴식</label><select data-work-rest="${e.id}">${restOptions(e.workRestSec)}</select></div><div class="field"><label>운동 메모</label><input data-exnote="${e.id}" value="${escapeHtml(e.note||'')}" placeholder="예: 벨트"></div></div><div class="sethead"><div>종류</div><div>${weightLabel(x)}(${(e.unit||'kg').toUpperCase()})</div><div>횟수</div><div>RPE</div><div>완료</div></div>${e.sets.map((s,i)=>setRow(e,s,i)).join('')}<button class="linkbtn" data-add-set="${e.id}" style="margin-top:10px">+ 세트 추가</button></div>`}
function weightLabel(x){if(x.loadMode==='bodyweight_add')return '추가중량';if(x.loadMode==='assisted')return '어시스트';if(x.loadMode==='bodyweight')return '중량';return '무게'}
function setRow(e,s,i){const x=exById(e.exerciseId),unit=e.unit||x?.preferredUnit||'kg';const pr=(s.prWeight||s.prE1RM)?'<span class="tag pr">PR</span>':'';return `<div class="setrow ${s.warmup?'warmrow':''}" data-set="${s.id}"><button class="settype ${s.warmup?'warm':''}" data-warm="${e.id}|${s.id}" title="워밍업/본세트 전환">${s.warmup?'W':'본'}</button><input inputmode="decimal" data-weight="${e.id}|${s.id}" value="${unitWeight(s.weightKg,unit)}" placeholder="0"><input inputmode="numeric" data-reps="${e.id}|${s.id}" value="${s.reps||''}" placeholder="0"><select data-rpe="${e.id}|${s.id}">${rpeOptions(s.rpe)}</select><button class="donebox ${s.done?'done':''}" data-done="${e.id}|${s.id}">${s.done?'✓':'□'}</button></div><div class="setmeta"><span>#${i+1}</span><span>${s.warmup?'워밍업':'본세트'}</span><span>휴식 목표</span><select data-set-rest="${e.id}|${s.id}" ${s.done?'disabled':''}>${restOptions(s.targetRestSec)}</select>${s.done&&s.restActualSec!=null?`<span class="actualrest">실제 ${fmtTime(s.restActualSec)}</span>`:''}${pr}</div>`}
function cardioSetRow(e,s,i){return `<div class="cardio-row"><input inputmode="decimal" data-duration="${e.id}|${s.id}" value="${s.durationMin||''}" placeholder="30"><input inputmode="decimal" data-distance="${e.id}|${s.id}" value="${s.distanceKm||''}" placeholder="5.0"><select data-rpe="${e.id}|${s.id}">${rpeOptions(s.rpe)}</select><button class="donebox ${s.done?'done':''}" data-done="${e.id}|${s.id}">${s.done?'✓':'□'}</button></div>`}
function renderTimer(ses){if(!ses.restTimer)return '';const t=ses.restTimer,elapsed=Math.floor((Date.now()-t.startedAt)/1000),remain=t.targetSec-elapsed;return `<div class="timer"><div><div class="mini">휴식 · ${escapeHtml(t.exerciseName)}</div><strong id="restClock" class="mono ${remain<0?'over':''}">${remain>=0?fmtTime(remain):'+'+fmtTime(-remain)}</strong><div class="restgoal">목표 ${fmtTime(t.targetSec)} · 다음 세트 시작 시 실제 휴식 저장</div></div><button class="btn small" id="nextSetStart">다음 세트 시작</button></div>`}
function workoutSummaryCard(w){const m=sessionMetrics(w),muscles=musclesForWorkout(w);return `<div class="card"><div class="listrow"><div><strong>${fmtDate(w.date)}</strong><div class="mini">${muscles.join(' · ')||'부위 미지정'}</div></div><div class="right"><strong>${fmtDur(workoutDuration(w))}</strong><div class="mini">본세트 ${m.sets} · ${fmtVolume(m.vol)}</div></div></div>${w.exercises.map(es=>{const x=exById(es.exerciseId);if(x?.tracking==='cardio'){const mins=es.sets.filter(s=>s.done).reduce((a,s)=>a+(Number(s.durationMin)||0),0);return `<div class="listrow"><div>${escapeHtml(x?.name||'삭제된 운동')}</div><div class="right mini">${mins}분</div></div>`}const sets=workingSets(es);return `<div class="listrow"><div>${escapeHtml(x?.name||'삭제된 운동')}</div><div class="right mini">${sets.length}세트 · ${fmtVolume(sets.reduce((a,s)=>a+setVolume(x,s),0))}</div></div>`}).join('')}</div>`}
function filteredWorkouts(){const ws=[...state.workouts].reverse(),now=new Date();if(historyFilter==='week')return ws.filter(w=>sameWeek(w.date,now));if(historyFilter==='month')return ws.filter(w=>sameMonth(w.date,now));return ws}
function historyView(){const ws=filteredWorkouts();return `<div class="section-title"><h2>과거 기록</h2><div class="section-tools"><button class="summary-unit" data-summary-unit>${summaryUnit().toUpperCase()}</button></div></div><div class="pillrow" style="margin-bottom:10px">${[['all','전체'],['week','이번 주'],['month','이번 달']].map(([v,t])=>`<button class="btn ${historyFilter===v?'':'secondary'} small" data-history-filter="${v}">${t}</button>`).join('')}</div><div class="card">${calendar(historyCalendarDate)}</div><div id="historyList">${ws.length?ws.map(w=>`<button class="card" data-open-workout="${w.id}" style="width:100%;text-align:left;color:inherit">${workoutSummaryCard(w).replace(/^<div class="card">|<\/div>$/g,'')}</button>`).join(''):'<div class="card empty">해당 기간 기록이 없습니다.</div>'}</div>`}
function calendar(base){const y=base.getFullYear(),m=base.getMonth(),first=new Date(y,m,1),start=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),years=calendarYears(y);let cells='';for(let i=0;i<start;i++)cells+='<div class="day blank"></div>';for(let d=1;d<=days;d++){const dt=new Date(y,m,d),has=state.workouts.some(w=>new Date(w.date).toDateString()===dt.toDateString()),today=dt.toDateString()===new Date().toDateString();cells+=`<button class="day ${has?'has':''} ${today?'today':''}" data-day="${dt.toISOString()}">${d}</button>`}return `<div class="calendar-jump"><div class="calendar-select-wrap"><label>년</label><select id="historyYear">${years.map(v=>`<option value="${v}" ${v===y?'selected':''}>${v}년</option>`).join('')}</select></div><div class="calendar-select-wrap"><label>월</label><select id="historyMonth">${Array.from({length:12},(_,i)=>`<option value="${i}" ${i===m?'selected':''}>${i+1}월</option>`).join('')}</select></div><span class="mini calendar-legend">● 운동 기록</span></div><div class="calendar"><div class="mini">월</div><div class="mini">화</div><div class="mini">수</div><div class="mini">목</div><div class="mini">금</div><div class="mini">토</div><div class="mini">일</div>${cells}</div>`}
function calendarYears(selected){const workoutYears=state.workouts.map(w=>new Date(w.date).getFullYear()).filter(Number.isFinite),now=new Date().getFullYear(),min=Math.min(selected,now-5,...(workoutYears.length?workoutYears:[selected])),max=Math.max(selected,now+2,...(workoutYears.length?workoutYears:[selected]));return Array.from({length:max-min+1},(_,i)=>max-i)}
function countSets(workouts){const muscle={},exercise={};workouts.forEach(w=>w.exercises.forEach(es=>{const x=exById(es.exerciseId);if(!x||x.tracking==='cardio')return;const c=workingSets(es).length;exercise[x.name]=(exercise[x.name]||0)+c;x.primary.forEach(m=>muscle[m]=(muscle[m]||0)+c);if(state.settings.countSecondary)x.secondary.forEach(m=>muscle[m]=(muscle[m]||0)+c)}));return {muscle,exercise}}

function barCard(obj){const arr=Object.entries(obj).sort((a,b)=>b[1]-a[1]);if(!arr.length)return '<div class="card empty">아직 데이터가 없습니다.</div>';const max=Math.max(...arr.map(x=>x[1]),1);return `<div class="card">${arr.map(([k,v])=>`<div class="listrow"><div style="flex:1"><strong>${escapeHtml(k)}</strong><div class="barwrap"><div class="bar" style="width:${v/max*100}%"></div></div></div><div class="right"><strong>${v}</strong><div class="mini">세트</div></div></div>`).join('')}</div>`}

function filterBySearch(selector,q){q=(q||'').trim().toLowerCase();$$(selector).forEach(el=>{const show=!q||el.dataset.search?.includes(q);el.style.display=show?(el.classList.contains('picker-row')?'grid':el.tagName==='BUTTON'?'flex':'block'):'none'})}

function dragScrollContainerFor(el){return el?.closest('.sheet')||null}
function bindLongPressReorder({handleSelector,itemSelector,container,getId,onCommit}){
 if(!container)return;
 $$(handleSelector).forEach(handle=>{
  if(handle.dataset.reorderBound)return;handle.dataset.reorderBound='1';
  let timer=null,dragging=false,item=null,pid=null,startX=0,startY=0,lastY=0;
  const clear=()=>{if(timer){clearTimeout(timer);timer=null}};
  const begin=()=>{item=handle.closest(itemSelector);if(!item)return;dragging=true;item.classList.add('is-dragging');document.body.classList.add('reorder-active');try{navigator.vibrate?.(18)}catch{}};
  const autoScroll=y=>{const sc=dragScrollContainerFor(item);const edge=72;if(sc){const r=sc.getBoundingClientRect();if(y<r.top+edge)sc.scrollBy({top:-10,behavior:'auto'});else if(y>r.bottom-edge)sc.scrollBy({top:10,behavior:'auto'})}else{if(y<edge)window.scrollBy(0,-10);else if(y>window.innerHeight-edge)window.scrollBy(0,10)}};
  const move=e=>{if(e.pointerId!==pid)return;lastY=e.clientY;if(!dragging){if(Math.hypot(e.clientX-startX,e.clientY-startY)>9)clear();return}e.preventDefault();autoScroll(e.clientY);const hit=document.elementFromPoint(e.clientX,e.clientY)?.closest(itemSelector);if(!hit||hit===item||hit.parentElement!==container)return;const r=hit.getBoundingClientRect();container.insertBefore(item,e.clientY<r.top+r.height/2?hit:hit.nextSibling)};
  const end=e=>{if(pid!==null&&e.pointerId!==undefined&&e.pointerId!==pid)return;clear();if(dragging&&item){item.classList.remove('is-dragging');document.body.classList.remove('reorder-active');const ids=[...container.querySelectorAll(itemSelector)].map(getId).filter(Boolean);onCommit?.(ids)}dragging=false;item=null;pid=null};
  handle.addEventListener('pointerdown',e=>{if(e.button!==undefined&&e.button!==0)return;pid=e.pointerId;startX=e.clientX;startY=e.clientY;lastY=e.clientY;clear();try{handle.setPointerCapture?.(pid)}catch{};timer=setTimeout(begin,320)},{passive:true});
  handle.addEventListener('pointermove',move,{passive:false});
  handle.addEventListener('pointerup',end);
  handle.addEventListener('pointercancel',end);
  handle.addEventListener('contextmenu',e=>e.preventDefault());
 });
}
function bindWorkoutReorder(){const box=$('#activeExerciseList');if(!box||!state.active)return;bindLongPressReorder({handleSelector:'[data-workout-drag]',itemSelector:'[data-exsession]',container:box,getId:el=>el.dataset.exsession,onCommit:ids=>{const map=new Map(state.active.exercises.map(e=>[e.id,e]));state.active.exercises=ids.map(id=>map.get(id)).filter(Boolean);save()}})}
function newSet(warmup=false,targetRestSec=180,tracking='strength'){return {id:uid(),weightKg:'',reps:'',rpe:'',warmup,done:false,targetRestSec:Number(targetRestSec)||180,restTargetSec:null,restActualSec:null,completedAt:null,durationMin:'',distanceKm:'',prWeight:false,prE1RM:false,tracking}}
function addExerciseToSession(exId,manufacturer='',setCount=1){const x=exById(exId);if(!x)return;const n=Math.max(1,Math.min(20,Number(setCount)||1));ensureSession().exercises.push({id:uid(),exerciseId:exId,manufacturer:isMachine(x)?manufacturer:'',note:'',warmRestSec:x.warmupRest||60,workRestSec:x.workingRest||180,unit:x.preferredUnit||'kg',sets:Array.from({length:n},()=>newSet(false,x.workingRest||180,x.tracking))});save()}
function startRoutine(rid){ensureSession();const r=state.routines.find(x=>x.id===rid);if(r&&state.active.exercises.length===0)r.exerciseIds.forEach(id=>addExerciseToSession(id,r.manufacturers?.[id]||'',r.setCounts?.[id]||1));view='home';render()}
function toggleSummaryUnit(){state.settings.summaryUnit=summaryUnit()==='kg'?'lb':'kg';save();render()}
function toggleExerciseUnit(eid){const e=state.active?.exercises.find(x=>x.id===eid);if(!e)return;const x=exById(e.exerciseId);e.unit=(e.unit||x?.preferredUnit||'kg')==='kg'?'lb':'kg';if(x)x.preferredUnit=e.unit;save();render()}
function routineSelectedHtml(ids=[]){if(!ids.length)return '<span class="mini">아직 선택된 운동이 없습니다.</span>';return ids.map(id=>{const x=exById(id),b=modal?.brands?.[id]||'',sets=Math.max(1,Math.min(20,Number(modal?.setCounts?.[id])||1));return x?`<div class="routine-order-item" data-routine-order-item="${id}"><div class="routine-drag-zone" data-routine-drag="${id}" title="길게 눌러 순서 변경"><span class="drag-grip">⋮⋮</span><div class="routine-drag-copy"><strong>${escapeHtml(x.name)}</strong>${b?`<span class="mini">${escapeHtml(b)}</span>`:''}</div></div><div class="routine-set-stepper"><button type="button" data-routine-set-minus="${id}" aria-label="세트 감소">−</button><strong id="routineSetCount-${id}">${sets}세트</strong><button type="button" data-routine-set-plus="${id}" aria-label="세트 증가">＋</button></div><button type="button" class="routine-remove" data-routine-remove="${id}" aria-label="${escapeHtml(x.name)} 제거">×</button></div>`:''}).join('')}
function refreshRoutineUI(){if(modal?.type!=='routine')return;const ids=modal.selected||[],box=$('#routineSelected'),count=$('#routineSelectedCount');if(box)box.innerHTML=routineSelectedHtml(ids);if(count)count.textContent=`${ids.length}개`;$$('[data-routine-toggle]').forEach(b=>{const on=ids.includes(b.dataset.routineToggle),row=b.closest('.routine-ex-item');row?.classList.toggle('selected',on);const s=b.querySelector('.routine-status');if(s)s.textContent=on?'✓ 추가됨':'＋ 추가'});bindRoutineSelectedControls()}
function toggleRoutineExercise(id){if(modal?.type!=='routine')return;modal.selected=modal.selected||[];modal.setCounts=modal.setCounts||{};const i=modal.selected.indexOf(id);if(i>=0)modal.selected.splice(i,1);else{modal.selected.push(id);if(!modal.setCounts[id])modal.setCounts[id]=3}refreshRoutineUI()}
function changeRoutineSetCount(id,delta){if(modal?.type!=='routine')return;modal.setCounts=modal.setCounts||{};const next=Math.max(1,Math.min(20,(Number(modal.setCounts[id])||1)+delta));modal.setCounts[id]=next;const label=document.getElementById(`routineSetCount-${id}`);if(label)label.textContent=`${next}세트`}
function bindRoutineSelectedControls(){$$('[data-routine-remove]').forEach(b=>b.onclick=()=>toggleRoutineExercise(b.dataset.routineRemove));$$('[data-routine-set-minus]').forEach(b=>b.onclick=e=>{e.stopPropagation();changeRoutineSetCount(b.dataset.routineSetMinus,-1)});$$('[data-routine-set-plus]').forEach(b=>b.onclick=e=>{e.stopPropagation();changeRoutineSetCount(b.dataset.routineSetPlus,1)});bindLongPressReorder({handleSelector:'[data-routine-drag]',itemSelector:'[data-routine-order-item]',container:$('#routineSelected'),getId:el=>el.dataset.routineOrderItem,onCommit:ids=>{if(modal?.type==='routine')modal.selected=ids}})}
function refreshPickUI(){if(modal?.type!=='pickExercise')return;const ids=modal.selected||[],count=$('#pickCount');if(count)count.textContent=ids.length?`(${ids.length})`:'';$$('[data-pick-toggle]').forEach(b=>{const on=ids.includes(b.dataset.pickToggle),row=b.closest('[data-pick-row]');row?.classList.toggle('selected',on);const s=b.querySelector('.picker-status');if(s)s.textContent=on?'✓ 선택됨':'＋ 선택'})}
function togglePickExercise(id){if(modal?.type!=='pickExercise')return;modal.selected=modal.selected||[];const i=modal.selected.indexOf(id);if(i>=0)modal.selected.splice(i,1);else modal.selected.push(id);refreshPickUI()}
function confirmPickedExercises(){if(modal?.type!=='pickExercise')return;if(!modal.selected?.length){modal=null;render();return}modal.selected.forEach(id=>addExerciseToSession(id,modal.brands?.[id]||''));modal=null;render()}
function deleteRoutine(){if(!modal?.id)return;const r=state.routines.find(x=>x.id===modal.id);if(!r)return;if(!confirm(`‘${r.name}’ 루틴을 삭제할까요?`))return;state.routines=state.routines.filter(x=>x.id!==r.id);save();modal=null;render()}

function findSet(eid,sid){return state.active.exercises.find(x=>x.id===eid)?.sets.find(x=>x.id===sid)}
function changeSet(key,field,val){const [eid,sid]=key.split('|'),s=findSet(eid,sid);if(s){s[field]=val;save()}}
function toggleWarm(key){const [eid,sid]=key.split('|'),e=state.active.exercises.find(x=>x.id===eid),s=findSet(eid,sid);if(!s||s.done)return;s.warmup=!s.warmup;s.targetRestSec=s.warmup?e.warmRestSec:e.workRestSec;save();render()}
function primeAudio(){try{if(!audioCtx){audioCtx=new (window.AudioContext||window.webkitAudioContext)()}if(audioCtx.state==='suspended')audioCtx.resume()}catch{}}
function alertRest(){if(!state.settings.restAlerts)return;try{navigator.vibrate?.([180,90,180])}catch{};try{primeAudio();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=760;g.gain.value=.045;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.18);setTimeout(()=>{try{const o2=audioCtx.createOscillator(),g2=audioCtx.createGain();o2.frequency.value=940;g2.gain.value=.045;o2.connect(g2);g2.connect(audioCtx.destination);o2.start();o2.stop(audioCtx.currentTime+.18)}catch{}},220)}catch{}}
function toggleDone(key){const [eid,sid]=key.split('|'),e=state.active.exercises.find(x=>x.id===eid),s=findSet(eid,sid),x=exById(e.exerciseId);if(!s)return;if(s.done){s.done=false;s.completedAt=null;s.restActualSec=null;s.prWeight=false;s.prE1RM=false;if(state.active.restTimer?.setId===sid)state.active.restTimer=null;save();render();return}s.done=true;s.completedAt=Date.now();if(x?.tracking!=='cardio'&&!s.warmup){const pb=previousBest(e.exerciseId),load=effectiveLoadKg(x,s),one=e1rm(x,s);s.prWeight=pb.weight>0&&load>pb.weight+.001;s.prE1RM=pb.one>0&&one>pb.one+.001}s.restTargetSec=s.targetRestSec;s.restActualSec=null;if(x?.tracking!=='cardio'){primeAudio();state.active.restTimer={setId:sid,exerciseSessionId:eid,exerciseName:x?.name||'',startedAt:Date.now(),targetSec:Number(s.targetRestSec)||180,alerted:false}}save();render()}
function stopRest(){const t=state.active?.restTimer;if(!t)return;const s=findSet(t.exerciseSessionId,t.setId);if(s)s.restActualSec=Math.max(0,Math.floor((Date.now()-t.startedAt)/1000));state.active.restTimer=null;save();render()}
function updateLiveTimes(){const ses=active();if(!ses)return;const wc=$('#workoutClock');if(wc)wc.textContent=fmtDur(workoutDuration(ses));const rc=$('#restClock');if(rc&&ses.restTimer){const elapsed=Math.floor((Date.now()-ses.restTimer.startedAt)/1000),remain=ses.restTimer.targetSec-elapsed;rc.textContent=remain>=0?fmtTime(remain):'+'+fmtTime(-remain);rc.classList.toggle('over',remain<0);if(remain<=0&&!ses.restTimer.alerted){ses.restTimer.alerted=true;save();alertRest()}}}
function finishWorkout(){if(!state.active)return;modal={type:'finishWorkout'};render()}
function commitWorkout(){if(!state.active)return;if(state.active.restTimer)stopRest();state.active.endedAt=Date.now();state.workouts.push(state.active);state.active=null;modal=null;save();render()}
function discardActiveWorkout(){if(!state.active)return;if(!confirm('작성 중인 운동을 삭제할까요? 이 작업은 되돌릴 수 없습니다.'))return;state.active=null;modal=null;save();render()}
function saveExerciseForm(){const name=$('#exName').value.trim();if(!name){alert('운동 이름을 입력하세요.');return}const primary=$$('#primaryMuscles .chip.on').map(b=>b.dataset.muscle.split('|')[1]),secondary=$$('#secondaryMuscles .chip.on').map(b=>b.dataset.muscle.split('|')[1]).filter(m=>!primary.includes(m));if(!primary.length){alert('주동근을 1개 이상 선택하세요.');return}const data={name,equipment:$('#exEquip').value,brand:$('#exBrand').value.trim(),primary,secondary,tracking:$('#exTracking').value,loadMode:$('#exLoadMode').value,warmupRest:Number($('#exWarmRest').value),workingRest:Number($('#exWorkRest').value),preferredUnit:modal.id?(exById(modal.id).preferredUnit||'kg'):'kg',aliases:modal.id?(exById(modal.id).aliases||[]):[],library:modal.id?!!exById(modal.id).library:false};if(modal.id)Object.assign(exById(modal.id),data);else state.exercises.push({id:uid(),...data});save();modal=null;render()}
function saveRoutineForm(){if(modal?.type!=='routine')return;const name=($('#routineName')?.value||modal.nameDraft||'').trim();if(!name){alert('루틴 이름을 입력하세요.');return}if(!(modal.selected||[]).length){alert('루틴에 운동을 1개 이상 선택하세요.');return}const manufacturers={},setCounts={};(modal.selected||[]).forEach(id=>{if(modal.brands?.[id])manufacturers[id]=modal.brands[id];setCounts[id]=Math.max(1,Math.min(20,Number(modal.setCounts?.[id])||1))});if(modal.id){const r=state.routines.find(x=>x.id===modal.id);if(!r)return;r.name=name;r.exerciseIds=[...(modal.selected||[])];r.manufacturers=manufacturers;r.setCounts=setCounts}else state.routines.push({id:uid(),name,exerciseIds:[...(modal.selected||[])],manufacturers,setCounts});save();modal=null;render()}
function renderExerciseChart(exId){const box=$('#exerciseChart');if(!box)return;if(!exId){box.className='empty';box.textContent='운동을 선택하면 그래프가 표시됩니다.';return}const exd=exById(exId),pts=[];state.workouts.forEach(w=>{const sessions=w.exercises.filter(e=>e.exerciseId===exId);if(!sessions.length)return;let top=0,one=0;sessions.forEach(es=>workingSets(es).forEach(s=>{top=Math.max(top,effectiveLoadKg(exd,s));one=Math.max(one,e1rm(exd,s))}));if(top)pts.push({date:new Date(w.date),top,one})});if(!pts.length){box.className='empty';box.textContent='아직 본세트 기록이 없습니다.';return}const W=700,H=170,pad=24,max=Math.max(...pts.flatMap(p=>[p.top,p.one])),min=Math.min(...pts.flatMap(p=>[p.top,p.one]))*.92,x=i=>pad+(W-pad*2)*(pts.length===1?.5:i/(pts.length-1)),y=v=>H-pad-(H-pad*2)*((v-min)/(max-min||1)),path=k=>pts.map((p,i)=>(i?'L':'M')+x(i)+','+y(p[k])).join(' ');box.className='';box.innerHTML=`<div class="mini" style="margin:12px 0">실선: 최고 부하 · 점선: 예상 1RM</div><svg viewBox="0 0 ${W} ${H}" class="svgchart"><path d="${path('top')}" fill="none" stroke="currentColor" stroke-width="3"/><path d="${path('one')}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="7 6"/>${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.top)}" r="4" fill="currentColor"/><circle cx="${x(i)}" cy="${y(p.one)}" r="4" fill="var(--accent)"/>`).join('')}</svg><div class="mini">최근 ${pts.length}회 · 현재 최고 ${unitWeight(pts.at(-1).top,summaryUnit())}${summaryUnit()} · 예상 1RM ${Number(unitWeight(pts.at(-1).one,summaryUnit())).toFixed(1)}${summaryUnit()}</div>`}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`liftlog-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)}
function importData(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const incoming=JSON.parse(r.result);if(!incoming.exercises||!incoming.workouts)throw new Error();if(confirm('현재 데이터를 백업 파일 내용으로 바꿀까요?')){localStorage.setItem('liftlog_state',JSON.stringify(incoming));location.reload()}}catch{alert('올바른 LiftLog 백업 파일이 아닙니다.')}};r.readAsText(f)}
render();
</script>
</body>
